services:
  # The local S3 store for uploads. It runs without authentication.
  s3:
    image: chrislusf/seaweedfs:4.50
    container_name: tavern-s3
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "${S3_PORT:-8333}:8333"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/status"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the dev bucket once the store is up. Creating a bucket that exists fails, so it
  # checks the list first.
  s3-bucket:
    image: chrislusf/seaweedfs:4.50
    depends_on:
      s3:
        condition: service_healthy
    entrypoint:
      - sh
      - -c
      - >-
        echo s3.bucket.list | weed shell -master=s3:9333 | grep -qw tavern ||
        echo 's3.bucket.create -name tavern' | weed shell -master=s3:9333
    restart: "no"

volumes:
  s3-data:
